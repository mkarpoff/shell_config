# macOS-specific tmux settings (sourced via if-shell from tmux.conf).

# /bin/zsh on macOS is 5.9 (modern); use it directly. The Apollo envImprovement
# path used on the dev-desktop does not exist here.
set -g default-command /bin/zsh

# Larger scrollback + activity alerts (Mac desktop use)
set -g history-limit 50000
setw -g monitor-activity on
set -g visual-activity on
