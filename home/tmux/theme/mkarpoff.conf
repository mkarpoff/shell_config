#! /bin/tmux
# Powerline Cyan - Tmux Theme
# Created by Jim Myhrberg <contact@jimeh.me>.
#
# Inspired by vim-powerline: https://github.com/Lokaltog/powerline
#
# Requires terminal to be using a powerline compatible font, find one here:
# https://github.com/Lokaltog/powerline-fonts
#
# Uses the *-style option syntax introduced in tmux 2.9, which replaced the
# separate -fg/-bg/-attr options.

# Status update interval
set -g status-interval 5

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Basic status bar colors
set -g status-style 'fg=colour240,bg=colour235'

# Left side of status bar
set -g status-left-style 'fg=colour243,bg=colour233'
set -g status-left-length 40
set -g status-left "#[fg=colour233,bg=colour240] #S #[fg=colour240,bg=colour70] #[fg=colour233,bg=colour70]#H #[fg=colour70,bg=colour32] #[fg=colour233,bg=colour32] #I:#P #[fg=colour32,bg=colour235,nobold]"

# Right side of status bar
set -g status-right-style 'fg=colour243,bg=colour233'
set -g status-right-length 150
set -g status-right "#[fg=colour70,bg=colour235]#[fg=colour233,bg=colour70] %I:%M %p #[fg=colour245,bg=colour70]#[fg=colour233,bg=colour245] %d-%b-%y #[fg=colour240]#[fg=colour232,bg=colour240,bold] "

# Window status
set -g window-status-format "  #I:#W#F  "
set -g window-status-current-format "#[fg=colour235,bg=black]#[fg=colour81,nobold] #I:#W#F #[fg=colour235,bg=black,nobold]"

# Current window status
set -g window-status-current-style 'fg=colour235,bg=colour39'

# Window with activity status
set -g window-status-activity-style 'fg=colour233,bg=colour245'

# Window separator
set -g window-status-separator ""

# Window status alignment
set -g status-justify centre

# Pane border
set -g pane-border-style 'fg=colour238,bg=default'

# Active pane border
set -g pane-active-border-style 'fg=colour39,bg=default'

# Pane number indicator
set -g display-panes-colour colour233
set -g display-panes-active-colour colour245

# Clock mode
set -g clock-mode-colour colour39
set -g clock-mode-style 24

# Message
set -g message-style 'fg=black,bg=colour39'

# Command message
set -g message-command-style 'fg=black,bg=colour233'

# Mode
set -g mode-style 'fg=colour232,bg=colour39'
