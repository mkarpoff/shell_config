# Dev-desktop (Amazon Linux) tmux settings (sourced via if-shell from tmux.conf).

# Set the default shell to the Apollo envImprovement zsh (5.9).
# NB: do not use $SHELL here -- passwd says /bin/zsh, which is the older 5.8.1
# system build. Do not use /usr/local/bin/zsh either; it does not exist on this
# host, and pointing default-command at a missing binary makes every pane exec
# fail, which kills the tmux server before a client can attach.
set -g default-command /apollo/env/envImprovement/bin/zsh
